# Autowash stack for Portainer (Stacks -> Web editor).
# Images are built by GitHub Actions and pulled from ghcr.io (see DEPLOY.md).
# Set the variables in Portainer's "Environment variables" section, not in this file.
services:
  mysql:
    image: mysql:8.4
    container_name: autowash-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: autowash
      MYSQL_USER: autowash
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD (letters and digits only)}
    volumes:
      - autowash_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    image: ghcr.io/sequoiaprint/autowash-backend:latest
    container_name: autowash-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-4100}:4100"
    environment:
      NODE_ENV: production
      PORT: "4100"
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the address the tablet opens, e.g. http://192.168.0.50:3100}
      DATABASE_URL: mysql://autowash:${MYSQL_PASSWORD}@mysql:3306/autowash?allowPublicKeyRetrieval=true
      MQTT_URL: ${MQTT_URL:-mqtt://192.168.0.177:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-autowash_backend_01}
      MQTT_TOPIC_ROOT: autowash/ryobi2
      MQTT_ONLINE_TOPIC: relay/status
      ACK_TIMEOUT_MS: "5000"
      STATUS_SETTLE_MS: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/sequoiaprint/autowash-frontend:latest
    container_name: autowash-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3100}:3100"
    depends_on:
      - backend

volumes:
  autowash_mysql:
